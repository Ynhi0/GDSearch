name: CI Checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          python -m pip install -r setup/requirements.txt

      - name: Import Scan
        run: |
          python tools/import_scan.py

      - name: Run pytest
        run: |
          pytest tests/ -q --maxfail=1

      - name: Checkpoint roundtrip
        run: |
          python tools/checkpoint_roundtrip_test.py
