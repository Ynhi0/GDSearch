name: CI

on:
  push:
    branches: [ main, 'feat/*', 'epic/*' ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install -r requirements-dev.txt || true
      - name: Run tests
        run: pytest -q
      - name: Notebook smoke (check cell count)
        run: |
          python - <<'PY'
import nbformat
nb = nbformat.read('notebooks/colab_qlora_finetune.ipynb', as_version=4)
print('nbcells', len(nb.cells))
PY
