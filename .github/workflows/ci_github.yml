name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install pytest nbformat
      - name: Run tests
        run: pytest -q
      - name: Notebook smoke check
        run: |
          python - <<'PY'
import nbformat
nb = nbformat.read('notebooks/colab_qlora_finetune.ipynb', as_version=4)
print('Notebook cells:', len(nb.cells))
assert len(nb.cells) >= 5
PY