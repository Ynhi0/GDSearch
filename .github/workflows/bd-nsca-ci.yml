name: BD-NSCA CI

on:
  push:
    paths:
      - 'integration/**'
      - 'tests/**'
      - 'docs/**'
  pull_request:
    paths:
      - 'integration/**'
      - 'tests/**'
      - 'docs/**'

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install deps
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Run BD-NSCA tests (fast)
        run: pytest tests/test_*bdnsca*.py -q || true
      - name: Run integration tests (full)
        run: pytest tests/test_inference_server_bdnsca.py -q || true
