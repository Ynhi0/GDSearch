# Pre-commit hooks for GDSearch
# Install: pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # File safety: Ensure safe I/O patterns
  - repo: local
    hooks:
      - id: check-safe-csv-usage
        name: Check for unsafe CSV writes
        entry: python scripts/hooks/check_safe_csv.py
        language: python
        files: \.(py)$
        exclude: ^(tests/|scripts/hooks/)
      
      - id: check-seeding-patterns
        name: Check for incomplete seeding
        entry: python scripts/hooks/check_seeding.py
        language: python
        files: (src/experiments/|src/analysis/).*\.py$
  
  # Code quality
  - repo: https://github.com/psf/black
    rev: 24.1.1
    hooks:
      - id: black
        args: [--line-length=120]
  
  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        args: [--max-line-length=120, --extend-ignore=E203,W503]
  
  # Security
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.6
    hooks:
      - id: bandit
        args: [-r, src/, -ll]
  
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=5000']
      - id: check-merge-conflict
      - id: debug-statements
  
  # Type checking
  - repo: local
    hooks:
      - id: pyright
        name: pyright
        entry: pyright
        language: node
        types: [python]
        files: (src/|scripts/).*\.py$
        pass_filenames: false
        additional_dependencies: ['pyright@1.1.350']
