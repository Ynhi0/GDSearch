[pytest]
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    gpu: marks tests that require GPU

# Reduce expected third-party deprecation / compatibility noise so real
# warnings surface in CI. Be targeted to avoid hiding repo-specific issues.
filterwarnings =
    # Pillow deprecation when constructing images in torchvision's MNIST loader
    ignore:'.*mode.*parameter.*is deprecated.*Pillow.*':DeprecationWarning
    # Also ignore deprecation warnings from torchvision.datasets.mnist specifically
    ignore::DeprecationWarning:torchvision.datasets.mnist
    # Suppress known GradScaler deprecation messages (handled via wrapper)
    ignore:'.*GradScaler.*':FutureWarning
    # Ignore invalid escape sequence SyntaxWarnings from legacy test strings
    ignore:.*invalid\\s+escape\\s+sequence.*:SyntaxWarning
    # As a last resort, allow expected SyntaxWarning patterns in legacy tests
    ignore:.*invalid escape sequence.*:SyntaxWarning
