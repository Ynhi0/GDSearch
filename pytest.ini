[pytest]
# Register custom marks to avoid PytestUnknownMarkWarning
markers =
    slow: marks tests as slow (use -m "not slow" to skip them)

# Silence warnings stemming from unknown marks and tests returning non-None
filterwarnings =
    ignore::pytest.PytestUnknownMarkWarning
    # Pillow deprecation: 'mode' parameter (Image.fromarray)
    ignore:'mode' parameter is deprecated and will be removed in Pillow 13:DeprecationWarning

    # Suppress expected dataset download/transform warnings in tests
    ignore:Downloading.*:UserWarning
    ignore:.*already exists.*:UserWarning
